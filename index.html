<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Modèle 3D Tortank</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: transparent; /* optionnel, si tu veux voir le fond de ton site derrière */
    }
    model-viewer {
      width: 600px;
      height: 600px;
      background-color: transparent; /* fond transparent du viewer */
    }
  </style>
</head>
<body>
  <model-viewer
    src="https://axelhuynh1-sketch.github.io/portfolio/ass_tortank_v2.glb"
    alt="Modèle 3D du robot marcheur"
    auto-rotate
    camera-controls
    ar
    background-color="transparent">
  </model-viewer>
</body>
</html>
